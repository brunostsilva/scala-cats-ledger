version: 2
updates:
  # Frontend (React + Vite).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Packages that must move together: react-dom requires the same react major, the
      # @types packages must match it, and @vitejs/plugin-react pins a Vite major. Grouping
      # them (for every update type, majors included) avoids single-package PRs that can't
      # install, e.g. react-dom 19 next to react 18 (npm ERESOLVE).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      testing-library:
        patterns: ["@testing-library/*", "jsdom"]
      # Everything else: minor/patch bumps in one weekly PR; other majors stay individual.
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Backend (Scala 3 + sbt): build.sbt and project/plugins.sbt. Dependabot supports sbt version
  # updates since May 2026 (security updates aren't available for sbt yet).
  - package-ecosystem: sbt
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # fs2-core is declared directly but pinned to the version http4s is built against, so the
      # two must move together.
      http4s-fs2:
        patterns: ["org.http4s:*", "co.fs2:*"]
      # Cats Effect, log4cats and munit-cats-effect follow the same Typelevel release train.
      typelevel:
        patterns: ["org.typelevel:*"]
      circe:
        patterns: ["io.circe:*"]
      # Everything else (Logback, munit, sbt plugins): minor/patch bumps in one weekly PR.
      sbt-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Actions used by .github/workflows (checkout, setup-java, setup-sbt, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
