version: 2
updates:
  # Frontend (React + Vite).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Packages that must move together: react-dom requires the same react major, the
      # @types packages must match it, and @vitejs/plugin-react pins a Vite major. Grouping
      # them (for every update type, majors included) avoids single-package PRs that can't
      # install, e.g. react-dom 19 next to react 18 (npm ERESOLVE).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      testing-library:
        patterns: ["@testing-library/*", "jsdom"]
      # Everything else: minor/patch bumps in one weekly PR; other majors stay individual.
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  # Actions used by .github/workflows (checkout, setup-java, setup-sbt, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

# The sbt backend is not covered: Dependabot's sbt ecosystem is still under development in
# dependabot-core. Scala Steward is the usual tool for keeping build.sbt up to date.
